# Hardware-neutral residual navigation core configuration.
grid:
  x_min: -2.0
  x_max: 6.0
  y_min: -4.0
  y_max: 4.0
  resolution: 0.05

path_features:
  path_points: 8
  path_spacing_m: 0.25

residual_policy:
  residual_limit_vx: 0.10
  residual_limit_vy: 0.10
  residual_limit_wz: 0.25
  hidden_sizes: [128, 128]
  activation: elu
  use_clearance_features: true
  use_curvature_features: true
