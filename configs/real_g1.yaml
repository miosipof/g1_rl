# Conservative real Unitree G1 adapter profile.
#
# This file is intentionally hardware-neutral. It does not instantiate Unitree,
# RealSense, Livox, Isaac, ROS, or OpenCV objects. Concrete adapters should load
# this profile, then replace runtime-discoverable values such as RealSense
# intrinsics with authoritative device readings.

profile_name: real_g1_conservative
clock_source: monotonic

camera:
  enabled: true
  resolution:
    width: 640
    height: 480
    fps: 30
  frame_id: camera_color_optical
  depth_frame_id: camera_depth_optical
  depth_aligned_to_color: true

  # RealSense adapters should normally read this from the device at runtime.
  # Leave null until calibrated / confirmed on the actual robot.
  intrinsics: null

  # RealSense depth adapters should read depth_scale from the device at runtime.
  # Leave null unless using recorded raw uint16 depth without device metadata.
  depth_scale_m_per_unit: null

  # TODO: replace with measured G1 mounting calibration.
  # Convention: this matrix maps camera-frame homogeneous points into body frame.
  T_body_camera:
    source_frame: camera_color_optical
    target_frame: body
    matrix:
      - [1.0, 0.0, 0.0, 0.35]
      - [0.0, 1.0, 0.0, 0.00]
      - [0.0, 0.0, 1.0, 0.35]
      - [0.0, 0.0, 0.0, 1.00]

  # Body-frame self/near-field exclusion for RGB-D target projection.
  # A YOLO detection whose projected 3D point falls inside this box is ignored.
  # Body convention: x forward, y left, z up.
  body_exclusion_box:
    enabled: true
    x_min: -0.50
    x_max: 0.45
    y_min: -0.50
    y_max: 0.50
    z_min: -0.25
    z_max: 1.40

lidar:
  enabled: true
  source_frame_id: livox_lidar
  frame_id: body
  mount_mode: normal

  # TODO: replace with measured MID-360/Livox mounting calibration.
  # Convention: this matrix maps LiDAR-frame homogeneous points into body frame.
  T_body_lidar:
    source_frame: livox_lidar
    target_frame: body
    matrix:
      - [1.0, 0.0, 0.0, 0.00]
      - [0.0, 1.0, 0.0, 0.00]
      - [0.0, 0.0, 1.0, 0.10]
      - [0.0, 0.0, 0.0, 1.00]

  min_range_m: 0.15
  max_range_m: 8.0
  z_min_m: 0.05
  z_max_m: 1.30
  max_points: 20000

  # Body-frame self/near-field exclusion for Livox points before occupancy/safety.
  # This removes points from the robot body, operator contact near the torso,
  # and near-zero forward artifacts that caused spurious front_obstacle_stop.
  body_exclusion_box:
    enabled: true
    x_min: -0.60
    x_max: 0.25
    y_min: -0.45
    y_max: 0.45
    z_min: -0.25
    z_max: 1.40

command_limits:
  # Initial real-robot limits are deliberately lower than Isaac smoke-test limits.
  vx_min: -0.05
  vx_max: 0.50
  vy_min: -0.05
  vy_max: 0.25
  wz_min: -0.20
  wz_max: 0.20
  max_linear_accel_mps2: 0.20
  max_yaw_accel_radps2: 0.40
  command_rate_hz: 10.0

watchdog:
  max_rgbd_age_s: 0.50
  max_lidar_age_s: 0.30
  max_robot_state_age_s: 0.30
  max_policy_age_s: 0.20
  stop_on_stale_rgbd: false
  stop_on_stale_lidar: true
  stop_on_stale_robot_state: true

perception:
  target_source: yolo
  target_depth_source: bbox
  yolo_model: yolov8n.pt
  yolo_device: auto
  target_class: person
  yolo_confidence_threshold: 0.25
  redetect_every_steps: 50
  occlusion_grace_steps: 600
  smoothing_alpha: 0.35
  max_jump_m: 1.25
  stand_off_m: 0.80

safety:
  require_operator_enable: true
  require_lidar_for_motion: true
  require_robot_state_for_motion: true
  stop_on_estop: true
  stop_on_robot_fault: true
  min_battery_percent: 20.0
  obstacle_stop_distance_m: 0.20
  obstacle_slow_distance_m: 0.40

metadata:
  notes:
    - "Calibration matrices are placeholders until measured on the physical G1."
    - "Run dry-run adapter tests before enabling real locomotion."
