project:
  name: g1_nav_rl

scene:
  num_envs: 1
  env_spacing: 4.0
  ground_prim_path: "/World/defaultGroundPlane"
  light_prim_path: "/World/Light"
  dome_light:
    intensity: 3000.0
    color: [0.75, 0.75, 0.75]
  viewer:
    eye: [4.0, 4.0, 3.0]
    target: [0.0, 0.0, 0.8]

proxy:
  prim_path: "{ENV_REGEX_NS}/G1Proxy"
  body_prim_path: "{ENV_REGEX_NS}/G1Proxy/body"
  init_state:
    pos: [0.0, 0.0, 0.55]
    yaw: 0.0

  # Approximate command-level body footprint.
  # Not a full G1 mesh; this is a stable navigation proxy.
  body:
    size: [0.55, 0.40, 1.10]
    color: [0.1, 0.35, 0.9]

  command_limits:
    max_vx: 0.8
    max_vy: 0.5
    max_wz: 1.2
    max_ax: 1.0
    max_ay: 1.0
    max_awz: 2.0
    smoothing_alpha: 0.20

camera:
  prim_path: "{ENV_REGEX_NS}/G1Proxy/front_cam"
  update_period: 0.05
  width: 640
  height: 480
  data_types:
    - rgb
    - distance_to_image_plane
  pinhole:
    focal_length: 24.0
    focus_distance: 400.0
    horizontal_aperture: 20.955
    clipping_range: [0.1, 100000.0]
  offset:
    # Approximate front camera position on a G1-like torso.
    pos: [0.35, 0.0, 0.35]
    rot_wxyz: [0.5, -0.5, 0.5, -0.5]
    convention: "ros"



observations:
  rgb_normalize: true
  depth_min: 0.0
  depth_max: 10.0

debug:
  print_every: 20
  save_screenshots: true
  save_every: 40
  screenshot_dir: "outputs/command_proxy_camera"

debug_cube:
  enabled: true
  prim_path: "{ENV_REGEX_NS}/DebugCube"
  # MeshCuboidCfg creates the actual USD mesh at {prim_path}/geometry/mesh.
  # RayCaster must target that mesh prim, not the parent Xform/asset prim.
  mesh_prim_path: "{ENV_REGEX_NS}/DebugCube/geometry/mesh"
  size: [0.8, 0.8, 0.8]
  pos: [2.2, 0.0, 0.4]
  color: [0.2, 0.8, 0.2]

  
target:
  enabled: true
  prim_path: "{ENV_REGEX_NS}/Target"
  pos: [4.0, 0.0, 0.08]
  size: [0.25, 0.25, 0.16]
  color: [1.0, 0.1, 0.1]
  # For target-following, reaching within roughly arm length is good enough.
  success_radius: 0.75
  controller:
    k_vx: 0.8
    k_vy: 0.8
    k_wz: 1.8
    slow_radius: 1.0



obstacle_safety:
  enabled: true

  # Portion of the depth image used for front-obstacle detection.
  vertical_band: [0.25, 0.90]
  center_width_frac: 0.60

  # If the center depth is below safety_distance, slow/avoid.
  # If below hard_stop_distance, stop forward motion.  
  safety_distance: 2.0
  hard_stop_distance: 1.1
  forward_scale_at_safety: 0.0
  sidestep_speed: 0.30
  yaw_away_rate: 0.50  
lidar:
  enabled: true
  # First smoke-test mount is a small kinematic rigid body.
  # RayCaster pose views are more reliable in headless mode when attached
  # to a physics prim, not a manually-authored Xform proxy root.
  prim_path: "{ENV_REGEX_NS}/G1LidarMount"
  mount_size: [0.05, 0.05, 0.05]
  mount_color: [1.0, 0.5, 0.0]
  update_period: 0.05
  debug_vis: false

  # RayCaster is a virtual sensor and must attach to an existing parent prim.
  # Attach directly to the already-created proxy root and use offset.pos as
  # the lidar frame.
  #
  # Initial smoke-test target. Isaac Lab RayCaster casts against configured
  # static mesh paths, so this first pass targets the static debug cube.
  # Keep num_envs=1 for this smoke test unless using a multi-mesh ray caster.
  mesh_prim_paths:
    - "{ENV_REGEX_NS}/DebugCube/geometry/mesh"
  max_distance: 8.0
  ray_alignment: "base"

  offset:
    # Smoke-test lidar height. Proxy root is at z=0.55, so z=0.15
    # places the horizontal scan at world z≈0.70, inside the debug cube.
    pos: [0.0, 0.0, 0.15]
    rot_wxyz: [1.0, 0.0, 0.0, 0.0]

  pattern:
    channels: 1
    vertical_fov_range: [0.0, 0.0]
    horizontal_fov_range: [-120.0, 120.0]
    horizontal_res: 1.0

  observations:
    min_range: 0.05
    max_range: 8.0

  occupancy_grid:
    # Body-frame grid: +x forward, +y left.
    x_min: -2.0
    x_max: 6.0
    y_min: -4.0
    y_max: 4.0
    resolution: 0.05
    occupied_value: 1.0

  debug:
    print_every: 10
    save_grid: true
    save_every: 20
    grid_dir: "outputs/lidar_grid"


local_planner:
  # DWA/DWB-style local velocity rollout planner.
  # Input: local occupancy grid + target vector in proxy/body frame.
  # Output: high-level command [vx, vy, wz].
  vx_samples: [0.0, 0.1, 0.2, 0.3]
  vy_samples: [-0.25, -0.1, 0.0, 0.1, 0.25]
  wz_samples: [-0.6, -0.3, 0.0, 0.3, 0.6]
  horizon_s: 1.5
  dt: 0.1
  robot_radius: 0.35
  # Extra planning buffer around the robot footprint. This makes the local
  # planner start avoidance before the obstacle is almost touching the proxy.
  collision_margin: 0.25
  goal_tolerance: 0.25
  progress_weight: 3.0
  final_distance_weight: 1.0
  clearance_weight: 1.5
  command_smoothness_weight: 0.2
  yaw_rate_weight: 0.3
  lateral_speed_weight: 0.4
  forward_speed_weight: 0.05
  final_lateral_error_weight: 1.0
  final_yaw_weight: 0.5
  collision_penalty: 100.0
  out_of_bounds_penalty: 25.0
  clearance_cap: 2.0
  stop_when_blocked: true
  debug:
    print_every: 10
    save_grid: true
    save_every: 20
    grid_dir: "outputs/lidar_planner"

# Grid-based A* planner adapted from PythonRobotics' A* example.
# Intended use: occupancy grid -> obstacle-aware body-frame waypoint path
# -> simple path follower command [vx, vy, wz].
grid_astar:
  occupancy_threshold: 0.5
  # Inflate obstacle cells by approximate body radius + safety margin.
  inflation_radius: 0.35
  # Added to the circumscribed proxy body radius when computing the effective
  # planning inflation radius in smoke_test_lidar_astar_planner.py.
  safety_margin: 0.25
  allow_diagonal: true
  heuristic_weight: 1.0
  max_expansions: 0
  path_follower:
    # Follow a point along the path, not the nearest sideways point.
    lookahead_distance: 1.00
    min_forward_x: 0.20
    max_vx: 0.30
    max_vy: 0.25
    max_wz: 0.60
    k_vx: 0.60
    k_vy: 0.80
    k_wz: 0.80
    stop_distance: 0.20
  path_memory:
    # Keep a selected path for many frames; do not replan every frame.
    replan_period_steps: 80
    path_reached_distance: 0.45
    path_behind_distance: 0.35
    # High penalty for switching to a geometrically different path.
    path_switch_weight: 8.0
    switch_min_improvement: 0.30
    compare_samples: 48
  command_smoothing:
    # Nominal smoothing suppresses left/right oscillation in open space. Near
    # obstacles, the smoke test switches to the near_* values so smoothing does
    # not prevent timely lateral/yaw escape.
    enabled: true
    alpha: 0.35
    max_delta_vx: 0.03
    max_delta_vy: 0.04
    max_delta_wz: 0.08
    adaptive_distance: 0.90
    near_alpha: 0.70
    near_max_delta_vx: 0.08
    near_max_delta_vy: 0.12
    near_max_delta_wz: 0.24
  clearance_safety:
    # Clearance-aware command limiter. Distances are robot-center to raw
    # obstacle footprint distance in body frame; edge clearance is printed as
    # center distance minus proxy body radius.
    enabled: true
    occupancy_threshold: 0.5
    forward_min_x: -0.20
    slow_distance: 1.05
    crawl_distance: 0.75
    stop_distance: 0.58
    max_vx_slow: 0.18
    max_vx_crawl: 0.08
    escape_enabled: true
    escape_distance: 0.90
    escape_min_x: -0.05
    escape_vy: 0.10
    escape_wz: 0.12
    side_deadband: 0.05
    # Optional assertion used by --assert_planner. Set null to only log.
    assert_min_edge_clearance: null
  hard_block:
    enabled: true
    front_x: 0.45
    half_width: 0.35
  debug:
    print_every: 10
    save_every: 20
    save_grid: true
    grid_dir: "outputs/lidar_astar_planner"
